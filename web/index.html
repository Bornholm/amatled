<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AmatlEd</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="dist/theme.css" />
</head>
<body>
  <div id="app">
    <nav id="menubar">
      <div class="menu-item" id="menu-fichier">
        <button class="menu-btn">Fichier</button>
        <ul class="menu-dropdown">
          <li><button class="menu-action" id="menu-open-workspace">Ouvrir un workspace<kbd>Ctrl+O</kbd></button></li>
          <li class="menu-sep"></li>
          <li><button class="menu-action" id="menu-export-pdf" disabled>Exporter en PDF</button></li>
        </ul>
      </div>
      <div class="menu-item" id="menu-affichage">
        <button class="menu-btn">Affichage</button>
        <ul class="menu-dropdown">
          <li><button class="menu-action" id="menu-wrap">↵ Retour à la ligne auto</button></li>
          <li class="menu-sep"></li>
          <li><button class="menu-action" id="menu-toggle-chat">Masquer le panneau de chat</button></li>
          <li class="menu-sep"></li>
          <li class="menu-label">Thème de l'éditeur</li>
          <li><button class="menu-action" id="menu-theme-dark" data-theme="dark">Sombre</button></li>
          <li><button class="menu-action" id="menu-theme-dark-contrast" data-theme="dark-contrast">Sombre contrasté</button></li>
          <li><button class="menu-action" id="menu-theme-light" data-theme="light">Clair</button></li>
        </ul>
      </div>
      <div class="menu-item" id="menu-chat-menu">
        <button class="menu-btn">Chat</button>
        <ul class="menu-dropdown">
          <li><button class="menu-action" id="menu-new-chat">Nouvelle conversation<kbd>Ctrl+Shift+N</kbd></button></li>
        </ul>
      </div>
      <div class="menubar-spacer"></div>
      <div id="render-preset-bar"></div>
      <div id="profile-bar"></div>
      <button class="btn btn--icon" id="btn-settings" title="Paramètres">⚙</button>
    </nav>
    <div id="main-layout">
      <aside id="tree-panel">
        <div id="tree-files"></div>
      </aside>
      <div id="editor-panel">
        <div id="tabs-bar"></div>
        <div id="file-changed-banner" class="file-changed-banner hidden" aria-live="polite">
          <span id="file-changed-msg">Le fichier a changé sur le disque.</span>
          <button class="btn btn--secondary" id="file-changed-reload">Recharger</button>
          <button class="btn btn--icon" id="file-changed-dismiss" aria-label="Ignorer">✕</button>
        </div>
        <div class="view-toggle">
          <button class="view-btn active" data-view="source">Source</button>
          <button class="view-btn" data-view="preview">Rendu</button>
        </div>
        <div id="editor-content"></div>
        <div id="editor-empty">
          <p>Sélectionnez un fichier dans l'arborescence</p>
          <p class="empty-hint">Fichier → Ouvrir un workspace ou <kbd>Ctrl+O</kbd></p>
        </div>
        <div id="preview-container" class="hidden">
          <div class="preview-spinner hidden">
            <span class="spinner-icon"></span> Rendu en cours…
          </div>
          <iframe id="preview-frame" frameborder="0"></iframe>
        </div>
      </div>
      <aside id="chat-panel">
        <div id="section-indicator">
          <span>Section active : </span>
          <span class="section-name" id="section-name">—</span>
        </div>
        <div id="chat-messages"></div>
        <div id="chat-input-bar">
          <textarea id="chat-input" placeholder="Ouvrez un fichier pour utiliser l'assistant…" disabled aria-label="Message à envoyer à l'assistant"></textarea>
          <div class="chat-buttons">
            <button id="chat-cancel" class="btn btn--secondary" style="display:none">✕ Annuler</button>
            <button id="chat-send" class="btn btn--primary" disabled>►</button>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <!-- Modale Paramètres -->
  <div id="settings-modal" class="modal-overlay">
    <div class="modal-dialog">
      <div class="modal-header">
        <h2>Paramètres</h2>
        <button class="settings-close-btn btn btn--icon" aria-label="Fermer">✕</button>
      </div>

      <!-- ── Onglets principaux ── -->
      <div class="settings-top-tabs" role="tablist">
        <button class="settings-top-tab active" data-top-tab="profiles" role="tab" aria-selected="true">Profils IA</button>
        <button class="settings-top-tab" data-top-tab="rendus" role="tab" aria-selected="false">Rendus</button>
      </div>

      <!-- ── Panneau Profils IA ── -->
      <div class="settings-top-panel active" data-top-panel="profiles">
        <div class="settings-profiles-bar">
          <select id="s-profile-select" class="form-control settings-profile-select"></select>
          <button type="button" id="s-profile-new" class="btn btn--secondary" title="Nouveau profil">+</button>
          <button type="button" id="s-profile-delete" class="btn btn--secondary" title="Supprimer le profil">×</button>
        </div>
        <form id="settings-form" class="settings-form">

          <p class="settings-group-title">LLM</p>
          <div class="form-group">
            <label for="s-provider">Provider</label>
            <select id="s-provider" class="form-control">
              <option value="openai">OpenAI</option>
              <option value="openrouter">OpenRouter</option>
              <option value="mistral">Mistral</option>
              <option value="custom">Autre (compatible OpenAI)</option>
            </select>
          </div>
          <div class="form-group">
            <label for="s-baseurl">URL de base</label>
            <input type="url" id="s-baseurl" class="form-control" placeholder="https://api.openai.com/v1" />
          </div>
          <div class="form-group">
            <label for="s-apikey">Clé API</label>
            <input type="password" id="s-apikey" class="form-control" placeholder="sk-…" />
          </div>
          <div class="form-group">
            <label for="s-model">Modèle</label>
            <input type="text" id="s-model" class="form-control" placeholder="gpt-4o, claude-3-5-sonnet…" />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="s-max-iter">Itérations max</label>
              <input type="number" id="s-max-iter" class="form-control" value="20" min="1" max="100" />
            </div>
            <div class="form-group">
              <label for="s-max-tokens">Tokens max</label>
              <input type="number" id="s-max-tokens" class="form-control" value="80000" min="4000" max="200000" />
            </div>
          </div>
          <div id="settings-test-status" class="settings-test-status"></div>

          <hr class="settings-divider" />
          <p class="settings-group-title">Rédaction</p>
          <div class="form-group">
            <label for="s-system-prompt">Prompt système personnalisé</label>
            <textarea id="s-system-prompt" class="form-control" rows="6" placeholder="Instructions supplémentaires pour l'agent (ton, contraintes, contexte…)"></textarea>
          </div>

          <hr class="settings-divider" />
          <p class="settings-group-title">Général</p>
          <div class="form-group form-group--checkbox">
            <input type="checkbox" id="s-normalize-on-save" />
            <label for="s-normalize-on-save">Normaliser le Markdown à la sauvegarde</label>
          </div>
          <div class="form-group">
            <label>Version</label>
            <span id="s-version" class="form-version-label">…</span>
          </div>
          <div class="form-group form-group--checkbox">
            <input type="checkbox" id="s-auto-update" checked />
            <label for="s-auto-update">Vérifier automatiquement les mises à jour au démarrage</label>
          </div>
          <div id="s-update-status" class="settings-test-status"></div>

        </form>
      </div>

      <!-- ── Panneau Rendus ── -->
      <div class="settings-top-panel" data-top-panel="rendus">
        <div class="settings-render-body">
          <div class="settings-presets-bar">
            <select id="s-preset-select" class="form-control settings-preset-select"></select>
            <button type="button" id="s-preset-new" class="btn btn--secondary" title="Nouveau préset">+</button>
            <button type="button" id="s-preset-delete" class="btn btn--secondary" title="Supprimer le préset">×</button>
          </div>
          <div id="s-preset-form" class="settings-preset-fields">
            <div class="form-group">
              <label for="s-render-config">Fichier de configuration amatl</label>
              <input type="text" id="s-render-config" class="form-control" placeholder="https://example.com/document.yml ou /chemin/local/config.yml" />
            </div>
            <div class="form-group form-group--row">
              <div class="form-group">
                <label for="s-render-config-username">Identifiant (Basic Auth)</label>
                <input type="text" id="s-render-config-username" class="form-control" placeholder="utilisateur" autocomplete="off" />
              </div>
              <div class="form-group">
                <label for="s-render-config-password">Mot de passe (Basic Auth)</label>
                <input type="password" id="s-render-config-password" class="form-control" placeholder="••••••••" autocomplete="off" />
              </div>
            </div>
          </div>
          <p id="s-preset-empty" class="settings-preset-empty hidden">Aucun préset de rendu. Cliquez sur + pour en créer un.</p>
        </div>
      </div>

      <div class="modal-footer">
        <button id="settings-update-btn" class="btn btn--secondary">Vérifier les mises à jour</button>
        <button id="settings-test-btn" class="btn btn--secondary">Tester la connexion</button>
        <button id="settings-save-btn" class="btn btn--primary">Enregistrer</button>
      </div>
    </div>
  </div>

  <script src="dist/bundle.js"></script>
</body>
</html>
