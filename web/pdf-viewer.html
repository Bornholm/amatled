<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: auto; background: #525659; }
    #viewer { display: flex; flex-direction: column; align-items: center; padding: 8px; gap: 8px; min-height: 100%; }
    .page-canvas { display: block; box-shadow: 0 2px 8px rgba(0,0,0,.5); background: white; max-width: 100%; }
    #status { color: #ccc; font-family: sans-serif; padding: 2rem; font-size: 14px; }
  </style>
</head>
<body>
  <div id="viewer">
    <div id="status">Chargement…</div>
  </div>
  <script type="module">
    import * as pdfjsLib from '/dist/pdf.min.mjs';
    pdfjsLib.GlobalWorkerOptions.workerSrc = '/dist/pdf.worker.min.mjs';

    const viewer = document.getElementById('viewer');
    const status = document.getElementById('status');

    const fileId = new URLSearchParams(location.search).get('fileId');
    if (!fileId) {
      status.textContent = 'Aucun fichier spécifié.';
    } else {
      try {
        const pdf = await pdfjsLib.getDocument(`/api/pdf?fileId=${encodeURIComponent(fileId)}`).promise;
        status.remove();

        const scale = (viewer.clientWidth - 16) / 595; // A4 width en pt ~595

        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const viewport = page.getViewport({ scale });

          const canvas = document.createElement('canvas');
          canvas.className = 'page-canvas';
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          viewer.appendChild(canvas);

          await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
        }
        window.parent.postMessage({ type: 'pdf-rendered' }, '*');
      } catch (err) {
        status.textContent = 'Erreur : ' + err.message;
        window.parent.postMessage({ type: 'pdf-rendered' }, '*');
      }
    }
  </script>
</body>
</html>
